<!doctype html>
<html lang="ja">


<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Puzzle Game</title>
<style>
  html, body { min-height: 100dvh; }
  body {
    background:#fff; color:#000; display:grid; place-items:start center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", sans-serif;
  }
  h1 { font-size: 50px; }
  p  { font-size: 30px; }

  /* すべての座標の”原点”になる枠 */
  .game {
    position: relative;    /* ←これが肝 */
    width: min(100vw, 800px);
    margin-inline: auto;
  }

  .square{
    width: min(100%, 600px);
    aspect-ratio: 1 / 1;
    border: 2px solid #ddd;
    --rows: 2; --cols: 2;
    background-image:
      linear-gradient(to right, #ddd, 1px, transparent 0),
      linear-gradient(to bottom, #ddd, 1px, transparent 0);
    background-size:
      calc(100% / var(--cols)) 100%,
      100% calc(100% / var(--rows));
    background-position: left top;
    background-repeat: repeat;
    position: relative;    /* ←完成画像をこの中で絶対配置するため */
    margin-block: 8px 16px;
  }

  .rectangle{
    width: 100%;
    aspect-ratio: 4 / 1;
    border: 2px solid #ddd;
    display: grid; place-items: center;
    margin-block: 12px 40px;
  }

  .draggable {
    position: absolute;     /* ← fixed をやめる */
    width: 100px; height: auto;
    left: 0; top: 0;
    user-select: none; touch-action: none;
    cursor: grab; border: 2px solid #ddd;
  }
  .dragging { cursor: grabbing; }

  .fade { opacity: 0; transition: opacity 1s ease; pointer-events: none; }
  .fade.is-visible { opacity: 1; }

  /* 完成画像はパズル台(.square)の中で100%オーバーレイする */
  #completed-picture {
    position: absolute;
    inset: 0;          /* top:0; right:0; bottom:0; left:0; */
    width: 100%; height: 100%;
    z-index: 10;
  }
</style>
</head>
<body>
  <h1>Let's play puzzle!</h1>
  <p id="status">Can you solve this puzzle? 🤔</p>

  <div class="game">
    <div class="square" id="board"></div>
    <div class="rectangle" id="dock"></div>

    <!-- ピースは .game の子に（＝同一座標系） -->
    <img id="a1" class="draggable" data-row="0" data-col="0" src="./pieces/A1.png" alt="A1">
    <img id="a2" class="draggable" data-row="0" data-col="1" src="./pieces/A2.png" alt="A2">
    <img id="b1" class="draggable" data-row="1" data-col="0" src="./pieces/B1.png" alt="B1">
    <img id="b2" class="draggable" data-row="1" data-col="1" src="./pieces/B2.png" alt="B2">

    <!-- 完成画像は .square の子に移動 -->
    <img id="completed-picture" class="fade" src="./completed_picture.png" alt="completed picture">
  </div>

<script>
(() => {
  const baseRows = 2, baseCols = 2;
  const game   = document.querySelector('.game');
  const board  = document.getElementById('board');
  const dock   = document.getElementById('dock');
  const done   = document.getElementById('completed-picture');
  const status = document.getElementById('status');

  board.style.setProperty('--rows', baseRows);
  board.style.setProperty('--cols', baseCols);

  // すべてローカル座標（game左上=0,0）で扱う
  let gameRect, boardRect, dockRect;
  function measure() {
    gameRect  = game.getBoundingClientRect();
    boardRect = board.getBoundingClientRect();
    dockRect  = dock.getBoundingClientRect();
  }
  measure();

  // ピース位置は「%」（game基準）で保存しておくとリサイズに強い
  const posPct = new Map(); // el -> {xPct, yPct}

  function pxToPct(x, y) {
    return {
      xPct: (x / gameRect.width) * 100,
      yPct: (y / gameRect.height) * 100
    };
  }
  function pctToPx(xPct, yPct) {
    return {
      x: (xPct / 100) * gameRect.width,
      y: (yPct / 100) * gameRect.height
    };
  }

  function setPositionPx(el, x, y) {
    el.style.left = `${x}px`;
    el.style.top  = `${y}px`;
    posPct.set(el, pxToPct(x, y));
  }
  function restorePositionFromPct(el) {
    const p = posPct.get(el); if (!p) return;
    const {x, y} = pctToPx(p.xPct, p.yPct);
    el.style.left = `${x}px`;
    el.style.top  = `${y}px`;
  }

  function localXY(clientX, clientY) {
    // client座標を game のローカル座標に変換
    return { x: clientX - gameRect.left, y: clientY - gameRect.top };
  }

  function randomInDock(pieceW) {
    // dockのローカル座標に変換
    const dl = dockRect.left - gameRect.left;
    const dt = dockRect.top  - gameRect.top;
    const dr = dl + dockRect.width;
    const db = dt + dockRect.height;
    const minX = dl, minY = dt;
    const maxX = dr - pieceW, maxY = db - pieceW;
    const x = Math.random() * (maxX - minX) + minX;
    const y = Math.random() * (maxY - minY) + minY;
    return {x, y};
  }

  const STATE = new WeakMap();

  function onPointerDown(e) {
    const el = e.currentTarget;
    el.classList.add('dragging');
    el.setPointerCapture?.(e.pointerId);

    // ここでは盤サイズに応じてピース表示サイズを調整したければどうぞ
    const { x, y } = { 
      x: parseFloat(getComputedStyle(el).left) || 0,
      y: parseFloat(getComputedStyle(el).top)  || 0
    };
    const { x: lx, y: ly } = localXY(e.clientX, e.clientY);
    STATE.set(el, { startLX: lx, startLY: ly, baseX: x, baseY: y });
  }

  function onPointerMove(e) {
    const el = e.currentTarget;
    const st = STATE.get(el); if (!st) return;
    const { x: lx, y: ly } = localXY(e.clientX, e.clientY);
    const dx = lx - st.startLX;
    const dy = ly - st.startLY;
    setPositionPx(el, st.baseX + dx, st.baseY + dy);
  }

  function onPointerUp(e) {
    const el = e.currentTarget;
    el.classList.remove('dragging');
    STATE.delete(el);

    const row = +el.dataset.row;
    const col = +el.dataset.col;

    // 盤のローカル原点
    const boardLeft = boardRect.left - gameRect.left;
    const boardTop  = boardRect.top  - gameRect.top;

    const pieceW = boardRect.width  / baseCols;
    const pieceH = boardRect.height / baseRows;

    const curX = parseFloat(getComputedStyle(el).left) || 0;
    const curY = parseFloat(getComputedStyle(el).top)  || 0;

    const targetX = boardLeft + pieceW * col;
    const targetY = boardTop  + pieceH * row;

    const inPos = (Math.abs(targetX - curX) < pieceW/3) &&
                  (Math.abs(targetY - curY) < pieceH/3);

    if (inPos) {
      setPositionPx(el, targetX, targetY);
      el.classList.add('in-position');
      detectSolved();
    } else {
      el.classList.remove('in-position');
      const {x, y} = randomInDock(100);
      setPositionPx(el, x, y);
    }
  }

  function detectSolved() {
    const num = document.getElementsByClassName('in-position').length;
    if (num === baseRows * baseCols) {
      done.classList.add('is-visible');
      status.textContent = '🧩🎊 Yay!! You solved!! 🎉✨';
    }
  }

  // 初期配置
  document.querySelectorAll('.draggable').forEach(el => {
    const {x, y} = randomInDock(100);
    setPositionPx(el, x, y);
    el.addEventListener('dragstart', ev => ev.preventDefault());
    el.addEventListener('pointerdown', onPointerDown);
    el.addEventListener('pointermove', onPointerMove);
    el.addEventListener('pointerup',   onPointerUp);
    el.addEventListener('pointercancel', onPointerUp);
  });

  // リサイズ/レイアウト変化に追従
  const ro = new ResizeObserver(() => {
    measure();                 // rectを取り直し
    // 盤上・ドック上すべてのピースを%から再配置
    document.querySelectorAll('.draggable').forEach(restorePositionFromPct);
  });
  ro.observe(game);
  window.addEventListener('scroll', () => {
    // スクロールでも rect が変わるので取り直し
    measure();
    document.querySelectorAll('.draggable').forEach(restorePositionFromPct);
  }, {passive:true});

})();
</script>
</body>
</html>
